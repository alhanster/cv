name: LaTeX build
on:
  push:
    # Without this, the force-push at the end of this job would retrigger it.
    branches-ignore:
      - 'gh-action-result/pdflatex'
jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to force-push the built PDFs to the orphan branch
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v5
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
              AlexHan.tex
              AlexHan-PubsOnly.tex
      - name: Commit to orphan branch
        run: |
          git checkout --orphan gh-action-result/pdflatex
          git rm -rf .
          git add AlexHan.pdf
          git add AlexHan-PubsOnly.pdf
          git -c user.name='GitHub Action' -c user.email='action@github.com' commit -m "Built CV"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-action-result/pdflatex
          force: true
